{% extends 'catalog/base.html' %}

{% block title %}Удаление товара | Django Store{% endblock %}

{% block content %}
<div class="card p-4 shadow-sm">
    <h1>Удалить товар</h1>

    <p>
        Ты действительно хочешь удалить товар:
        <strong>{{ object.name }}</strong>?
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Удалить
        </button>

        <a href="{% url 'catalog:product_detail' object.pk %}" class="btn btn-secondary">
            Отмена
        </a>
    </form>
</div>
{% endblock %}
