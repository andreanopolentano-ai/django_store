{% extends 'catalog/base.html' %}

{% block title %}Удаление статьи | Django Store{% endblock %}

{% block content %}
<div class="card p-4 shadow-sm">
    <h1>Удалить статью</h1>

    <p>
        Ты действительно хочешь удалить статью:
        <strong>{{ object.title }}</strong>?
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Удалить
        </button>

        <a href="{% url 'blog:detail' object.pk %}" class="btn btn-secondary">
            Отмена
        </a>
    </form>
</div>
{% endblock %}
